[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HalloTui"
version = "1.0.0"
description = "HalloTui prints a welcome message from the command line or from menu row 1."
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "Hello"]

dependencies = [
    "ChronicleLogger>=1.3.1",
]

# Official project links (this is what shows on PyPI!)
[project.urls]
Homepage = "https://github.com/cloudgen/HalloTui"
Repository = "https://github.com/cloudgen/HalloTui"
Issues = "https://github.com/cloudgen/HalloTui/issues"

# This makes `hallo-tui` command available after pip install
[project.scripts]
hallo-tui = "HalloTui.cli:main"